version: '3.8'
services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
  redis:
    image: redis:7-alpine
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
